---
- name: Ensure MariaDB is enabled and started
  ansible.builtin.systemd:
    name: mariadb
    enabled: true
    state: started

- name: Check slurmdbd database password file
  ansible.builtin.stat:
    path: "{{ ssn.derived.db_password_file }}"
  register: ssn_db_password_file

- name: Generate slurmdbd database password
  ansible.builtin.shell: |
    umask 077
    tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32 > {{ ssn.derived.db_password_file }}
    chown slurm:slurm {{ ssn.derived.db_password_file }}
    chmod 0400 {{ ssn.derived.db_password_file }}
  when: not ssn_db_password_file.stat.exists
  no_log: true

- name: Read slurmdbd database password
  ansible.builtin.slurp:
    src: "{{ ssn.derived.db_password_file }}"
  register: ssn_dbpw_b64
  no_log: true

- name: Set slurmdbd database password fact
  ansible.builtin.set_fact:
    ssn_slurmdbd_db_password: "{{ ssn_dbpw_b64.content | b64decode | trim }}"
  no_log: true

- name: Create Slurm accounting database
  ansible.builtin.command: >
    mysql --protocol=socket -uroot -e
    "CREATE DATABASE IF NOT EXISTS {{ ssn.derived.db_name }}
     CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
  changed_when: false

- name: Create Slurm accounting database user
  ansible.builtin.command: >
    mysql --protocol=socket -uroot -e
    "CREATE USER IF NOT EXISTS '{{ ssn.derived.db_user }}'@'localhost'
     IDENTIFIED BY '{{ ssn_slurmdbd_db_password }}';
     ALTER USER '{{ ssn.derived.db_user }}'@'localhost'
     IDENTIFIED BY '{{ ssn_slurmdbd_db_password }}';
     GRANT ALL PRIVILEGES ON {{ ssn.derived.db_name }}.*
     TO '{{ ssn.derived.db_user }}'@'localhost';
     FLUSH PRIVILEGES;"
  no_log: true
  changed_when: true

- name: Deploy slurmdbd.conf
  ansible.builtin.template:
    src: slurmdbd.conf.j2
    dest: "{{ ssn.derived.slurm_conf_dir }}/slurmdbd.conf"
    owner: slurm
    group: slurm
    mode: "0600"
  notify: Restart slurmdbd

- name: Flush slurmdbd handler
  ansible.builtin.meta: flush_handlers

- name: Enable and start slurmdbd
  ansible.builtin.systemd:
    name: slurmdbd
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for slurmdbd
  ansible.builtin.wait_for:
    port: "{{ ssn.derived.slurmdbd_port }}"
    host: 127.0.0.1
    timeout: 30

- name: Ensure Slurm accounting backup directory exists
  ansible.builtin.file:
    path: /var/backups/slurm-single-node/accounting
    state: directory
    owner: root
    group: "{{ ssn.derived.admin_group }}"
    mode: "0750"

- name: Install Slurm accounting dump script
  ansible.builtin.copy:
    dest: /usr/local/sbin/ssn-backup-slurmdb
    owner: root
    group: "{{ ssn.derived.admin_group }}"
    mode: "0750"
    content: |
      #!/bin/sh
      set -eu

      DB_NAME="{{ ssn.derived.db_name }}"
      BACKUP_DIR="/var/backups/slurm-single-node/accounting"
      RETENTION_DAYS=30
      DUMP_BIN="$(command -v mariadb-dump || command -v mysqldump || true)"

      if [ -z "$DUMP_BIN" ]; then
        echo "No mariadb-dump or mysqldump binary found" >&2
        exit 1
      fi

      mkdir -p "$BACKUP_DIR"
      chmod 0750 "$BACKUP_DIR"
      stamp="$(date -u +%Y%m%dT%H%M%SZ)"
      tmp="$BACKUP_DIR/${DB_NAME}.${stamp}.sql.gz.tmp"
      out="$BACKUP_DIR/${DB_NAME}.${stamp}.sql.gz"
      umask 077
      "$DUMP_BIN" --protocol=socket -uroot --single-transaction "$DB_NAME" | gzip -c > "$tmp"
      mv "$tmp" "$out"
      find "$BACKUP_DIR" -type f -name "${DB_NAME}.*.sql.gz" -mtime +"$RETENTION_DAYS" -print -delete

- name: Install Slurm accounting backup service
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssn-slurmdb-backup.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Slurm Single-Node accounting database backup
      After=mariadb.service
      Wants=mariadb.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/ssn-backup-slurmdb

- name: Install Slurm accounting backup timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssn-slurmdb-backup.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Run Slurm Single-Node accounting database backup daily

      [Timer]
      OnCalendar=daily
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Enable Slurm accounting backup timer
  ansible.builtin.systemd:
    name: ssn-slurmdb-backup.timer
    enabled: true
    state: started
    daemon_reload: true
